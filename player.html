<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>找不同大挑戰！加入遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#faf6f0] text-[#3c3c3c] min-h-screen flex flex-col select-none overflow-x-hidden">

<header class="bg-white/80 border-b border-stone-200 p-3 shadow-sm text-center">
    <h1 class="text-xl font-black text-[#2c2c2c] tracking-widest">🔍 找不同大挑戰！</h1>
    <p id="my-status" class="text-xs text-[#8c8273] font-bold mt-0.5"></p>
</header>

<!-- 加入畫面 -->
<div id="gate" class="flex-grow flex flex-col items-center justify-center gap-4 p-6">
    <p class="text-lg font-bold text-stone-600">輸入你的名字加入遊戲</p>
    <input id="name-input" maxlength="10" placeholder="你的名字" class="border-2 border-stone-200 rounded-xl px-4 py-3 text-center text-lg font-bold w-64 focus:outline-none focus:border-[#8fa89b]">
    <button id="join-btn" class="bg-[#8fa89b] hover:bg-[#7e978a] text-white font-black px-8 py-3 rounded-xl shadow-sm text-lg tracking-widest">加入遊戲</button>
</div>

<!-- 遊戲畫面 -->
<main id="game-view" class="hidden flex-grow flex flex-col items-center justify-center p-3 gap-3 relative">
    <div id="phase-banner" class="bg-white border border-[#e6dfd3] text-[#3c3c3c] font-black px-5 py-2 rounded-full shadow-md text-sm tracking-widest uppercase text-center">
        等待主控端開始遊戲…
    </div>

    <div class="flex items-center gap-4 text-xs sm:text-sm font-bold text-stone-500">
        <span>我的分數：<span id="my-score" class="text-[#7a9a83] font-mono text-base">0</span></span>
        <span>連勝：<span id="my-streak" class="font-mono">0</span></span>
    </div>

    <div id="cards-container" class="flex flex-wrap gap-3 w-full justify-center items-center min-h-[220px]"></div>

    <div class="w-full max-w-md flex flex-col items-center gap-1">
        <div class="w-full bg-slate-950 rounded-full h-3 p-0.5 border border-amber-500/20 overflow-hidden">
            <div id="timer-bar" class="bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500 h-full rounded-full transition-all duration-100" style="width: 0%;"></div>
        </div>
        <div id="timer-text" class="text-amber-600 font-mono font-bold text-xs tracking-widest">0.0 秒</div>
    </div>

    <!-- 本輪結果 -->
    <div id="round-result" class="hidden bg-white border border-stone-200 rounded-2xl shadow-md p-5 text-center max-w-xs w-full">
        <p id="result-title" class="text-2xl font-black mb-1"></p>
        <p id="result-score" class="text-lg font-mono font-bold text-[#7a9a83] mb-2"></p>
        <p id="result-rank" class="text-sm text-stone-500 font-bold"></p>
    </div>

    <!-- 即時排行榜（隨時可看，公布成績時也是同一份） -->
    <div class="bg-white border border-stone-200 rounded-2xl shadow-sm p-4 max-w-xs w-full">
        <h2 class="font-black text-sm text-[#2c2c2c] mb-2 flex items-center gap-1.5">🏆 即時排行榜</h2>
        <div id="leaderboard" class="flex flex-col gap-1.5 max-h-60 overflow-y-auto">
            <p class="text-xs text-stone-400 text-center py-3">尚無玩家加入</p>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shared.js"></script>
<script src="sync.js"></script>
<script>
const gateEl = document.getElementById('gate');
const gameViewEl = document.getElementById('game-view');
const nameInput = document.getElementById('name-input');
const joinBtn = document.getElementById('join-btn');
const myStatusEl = document.getElementById('my-status');
const phaseBanner = document.getElementById('phase-banner');
const myScoreEl = document.getElementById('my-score');
const myStreakEl = document.getElementById('my-streak');
const cardsContainer = document.getElementById('cards-container');
const timerBar = document.getElementById('timer-bar');
const timerText = document.getElementById('timer-text');
const roundResultEl = document.getElementById('round-result');
const resultTitleEl = document.getElementById('result-title');
const resultScoreEl = document.getElementById('result-score');
const resultRankEl = document.getElementById('result-rank');
const leaderboardEl = document.getElementById('leaderboard');

let myName = localStorage.getItem('spot-diff-name') || '';
nameInput.value = myName;

let myScore = 0;
let myStreak = 0;
let renderedRoundIndex = 0;
let hasAnswered = false;
let localTimer = null;
let currentRound = null;

joinBtn.addEventListener('click', join);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

function join() {
    const name = nameInput.value.trim();
    if (!name) return alert('請輸入名字');
    myName = name;
    localStorage.setItem('spot-diff-name', name);
    myScore = 0; myStreak = 0;
    writePlayer(myName, { name: myName, score: 0, streak: 0, joinedAt: Date.now(), lastAnsweredRound: 0 });

    gateEl.classList.add('hidden');
    gameViewEl.classList.remove('hidden');
    myStatusEl.textContent = LOCAL_MODE
        ? `${myName}・本機測試模式（同機分頁互通）`
        : `${myName}・已連線`;

    onRoom(handleRoomChange);
    onPlayers((players) => {
        const me = players[myName];
        if (me) { myScore = me.score; myStreak = me.streak; myScoreEl.textContent = me.score; myStreakEl.textContent = me.streak; }
        renderLeaderboard(players);
    });
}

function renderLeaderboard(players) {
    const list = Object.values(players || {}).sort((a, b) => b.score - a.score);
    if (list.length === 0) {
        leaderboardEl.innerHTML = '<p class="text-xs text-stone-400 text-center py-3">尚無玩家加入</p>';
        return;
    }
    leaderboardEl.innerHTML = list.map((p, i) => `
        <div class="flex items-center justify-between px-2.5 py-1.5 rounded-lg border text-xs ${p.name === myName ? 'border-[#8fa89b] bg-[#8fa89b]/10' : 'border-stone-200 bg-stone-50'}">
            <span class="font-bold text-stone-700">${i + 1}. ${p.name}${p.streak >= 2 ? ' 🔥' : ''}</span>
            <span class="font-mono font-black text-[#7a9a83]">${String(p.score).padStart(4, '0')}</span>
        </div>
    `).join('');
}

function handleRoomChange(room) {
    const round = room.round;
    if (!round) {
        phaseBanner.textContent = '等待主控端開始遊戲…';
        return;
    }
    if (round.index !== renderedRoundIndex) {
        // 新的一關開始，重置本輪狀態
        renderedRoundIndex = round.index;
        hasAnswered = false;
        currentRound = round;
        roundResultEl.classList.add('hidden');
        cardsContainer.classList.remove('hidden');
        const cards = round.cardIds.map(cardById);
        renderCardGrid(cardsContainer, cards, { onPick: (idx) => onPick(idx) });
    }
    currentRound = round;

    clearInterval(localTimer);
    if (room.status === 'memorize') {
        phaseBanner.textContent = `記憶階段：記住這 ${round.cardIds.length} 張卡片！`;
        flipCardGrid(cardsContainer, false);
        runLocalCountdown(round.phaseStartAt, round.memTime, () => {});
    } else if (room.status === 'hide') {
        phaseBanner.textContent = '悄悄修改中... 請聚精會神！';
        flipCardGrid(cardsContainer, true);
        timerBar.style.width = '0%';
        timerText.textContent = '';
    } else if (room.status === 'reveal') {
        phaseBanner.textContent = '答題階段：點出被修改的卡片！';
        flipCardGrid(cardsContainer, false);
        const cards = round.cardIds.map(cardById);
        swapCardFront(cardsContainer, round.changedIndex, cards[round.changedIndex], 'B');
        runLocalCountdown(round.phaseStartAt, round.guessTime, () => {
            if (!hasAnswered) submitMiss('時間到！');
        });
    } else if (room.status === 'ended') {
        clearInterval(localTimer);
        phaseBanner.textContent = '本關結束，等待主控端開下一關…';
        if (!hasAnswered) submitMiss('這輪沒來得及作答');
    } else if (room.status === 'finished') {
        clearInterval(localTimer);
        if (!hasAnswered) submitMiss('這輪沒來得及作答');
        phaseBanner.textContent = '🏆 遊戲結束！最終成績如下（見下方排行榜）';
        cardsContainer.classList.add('hidden');
    }
}

function runLocalCountdown(phaseStartAt, duration, onExpire) {
    function tick() {
        const elapsed = (Date.now() - phaseStartAt) / 1000;
        const left = Math.max(0, duration - elapsed);
        updateTimerBar(timerBar, timerText, left, duration);
        if (left <= 0) { clearInterval(localTimer); onExpire(); }
    }
    tick();
    localTimer = setInterval(tick, 100);
}

function onPick(idx) {
    if (hasAnswered || !currentRound) return;
    hasAnswered = true;
    const correct = idx === currentRound.changedIndex;
    const el = cardsContainer.querySelector(`[data-index="${idx}"]`);
    if (el) el.classList.add(correct ? 'flash-correct' : 'flash-incorrect');
    playSound(correct ? 'correct' : 'incorrect');

    const elapsedMs = Date.now() - currentRound.phaseStartAt;
    const remainingSec = Math.max(0, currentRound.guessTime - elapsedMs / 1000);
    finishRound(correct, remainingSec, elapsedMs, correct ? '🎉 答對了！' : '❌ 猜錯了');
}

function submitMiss(title) {
    hasAnswered = true;
    playSound('incorrect');
    finishRound(false, 0, Infinity, title);
}

function finishRound(correct, remainingSec, elapsedMs, title) {
    const timeBonus = correct ? Math.round(remainingSec * 10) : 0;
    const lightningBonus = correct && elapsedMs <= 2000 ? 30 : 0;
    const streakBonus = correct ? myStreak * (myStreak >= 2 ? 30 : 15) : 0;
    const roundScore = correct ? 100 + timeBonus + lightningBonus + streakBonus : 0;

    myScore += roundScore;
    myStreak = correct ? myStreak + 1 : 0;
    writePlayer(myName, { name: myName, score: myScore, streak: myStreak, joinedAt: Date.now(), lastAnsweredRound: currentRound.index });
    myScoreEl.textContent = myScore;
    myStreakEl.textContent = myStreak;

    resultTitleEl.textContent = title;
    resultScoreEl.textContent = correct ? `+${roundScore} 分` : '+0 分';
    roundResultEl.classList.remove('hidden');
    updateRank();
}

function updateRank() {
    const all = Object.values(playersState || {}).sort((a, b) => b.score - a.score);
    const myIdx = all.findIndex((p) => p.name === myName);
    if (myIdx >= 0) resultRankEl.textContent = `目前排名：第 ${myIdx + 1} 名（共 ${all.length} 人）`;
}
</script>
</body>
</html>
